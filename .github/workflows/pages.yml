name: Deploy prototype to GitHub Pages

# 把 prototype/ 目录作为一个纯静态站点发布到 GitHub Pages。
# 站点地址：https://lumiray92.github.io/think-first/
# 只要 prototype/ 有改动就会自动重新部署。

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype folder as site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4